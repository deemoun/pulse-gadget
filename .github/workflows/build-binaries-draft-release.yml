name: Build binaries (draft release)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to create/update for the draft release (for example v1.0.0)"
        required: true
      release_name:
        description: "Release title (defaults to tag_name)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
            artifact_name: pulse-gadget-linux-x64
            script: ./scripts/publish-single-cli.sh --rid linux-x64
          - target_name: Linux ARM64
            os: ubuntu-latest
            rid: linux-arm64
            artifact_name: pulse-gadget-linux-arm64
            script: ./scripts/publish-single-cli.sh --rid linux-arm64
          - target_name: Windows x64
            os: windows-latest
            rid: win-x64
            artifact_name: pulse-gadget-win-x64
            script: ./scripts/publish-single-cli-win.ps1 -Rid win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish binary (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./scripts/publish-single-cli.sh
          ${{ matrix.script }}

      - name: Publish binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ${{ matrix.script }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/cli/${{ matrix.rid }}
          if-no-files-found: error

  release:
    name: Publish draft release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: pulse-gadget-*

      - name: Package artifacts for release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-packages
          shopt -s nullglob

          for artifact_dir in release-assets/*; do
            [ -d "$artifact_dir" ] || continue
            artifact_name="$(basename "$artifact_dir")"

            if [[ "$artifact_name" == *"win"* ]]; then
              (cd "$artifact_dir" && zip -r "../../release-packages/${artifact_name}.zip" .)
            else
              tar -czf "release-packages/${artifact_name}.tar.gz" -C "$artifact_dir" .
            fi
          done

          ls -lah release-packages

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name || github.event.inputs.tag_name }}
          draft: true
          generate_release_notes: true
          files: |
            release-packages/*
